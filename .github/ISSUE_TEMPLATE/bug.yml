name: Bug
description: Something behaves differently from what was specified
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Never paste passcodes, tokens, session ids or the answer word. For a security problem use **Security -> Report a vulnerability** instead of this form.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Type ...
        3. Press ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical - data loss, security hole or app unusable
        - High - core game flow broken
        - Medium - wrong behaviour with a workaround
        - Low - cosmetic or minor
    validations:
      required: true
  - type: textarea
    id: failing_test
    attributes:
      label: Failing test idea
      description: The regression test that would fail today and pass after the fix (every bug fix starts with one).
      placeholder: "Answer ABIDE, guess SPEED -> expect XXYXY, currently returns XXYYY"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Release or commit
      placeholder: "v0.2.0 or abc1234"
  - type: dropdown
    id: environment
    attributes:
      label: Where it happens
      options:
        - local
        - CI
        - staging
        - production
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Before you submit
      options:
        - label: This issue contains no passcodes, tokens, secrets or answer words.
          required: true
